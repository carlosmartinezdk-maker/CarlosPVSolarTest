<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PI/PRI Solar Underperformance Explorer</title>
<style>
:root{
  --ink:#2b2b2b;      /* body text            */
  --muted:#6b6b6b;    /* secondary text       */
  --land:#e6e4e1;     /* map land fill        */
  --stroke:#ffffff;   /* map borders          */
  --bg:#fbfafa;       /* page background      */
  --accent:#1d4e6f;   /* the only brand blue  */
  --card:#f1efec;     /* card fill            */
  --panel-border:#e2ded8;
  --thead:#faf9f8;
  --row-hover:#eef4f8;
  --tip-border:#d8d4d0;
  --good:#2e7d4f; --warn:#b5791a; --bad:#b0392f; --lead:#c96a2e;
}
* { box-sizing: border-box; }
body { margin:0; font-family: Georgia,"Times New Roman",serif; background:var(--bg); color:var(--ink); font-size:14px; }
.arial, button, select, input, table, .eyebrow, .badge, .kcol, th, .tip, .footer, nav, .seg {
  font-family: Arial, Helvetica, sans-serif;
}
a { color: var(--accent); }
.eyebrow { font-size:11px; font-family:Arial,Helvetica,sans-serif; text-transform:uppercase;
  letter-spacing:.14em; color:var(--accent); font-weight:bold; margin-bottom:4px; }
header#topbar { position: sticky; top:0; z-index: 50; background: var(--bg);
  border-bottom: 1px solid var(--panel-border); padding: 10px 20px; display:flex; align-items:center; gap:14px; }
header#topbar h1 { font-size: 17px; margin:0; font-weight:normal; font-family:Georgia,serif; }
.seg { display:flex; gap:0; border:1px solid var(--panel-border); border-radius:6px; overflow:hidden; }
.seg button { background:var(--bg); border:none; border-right:1px solid var(--panel-border); color: var(--muted);
  padding: 6px 12px; cursor:pointer; font-size:12px; }
.seg button:last-child { border-right:none; }
.seg button.active { background: var(--accent); color:#fff; }
#footer-scope { position: sticky; bottom:0; background:#fff8e6; border-top: 2px solid var(--warn);
  padding: 8px 20px; font-size: 11px; font-family:Arial,Helvetica,sans-serif; color: #6b4d10; z-index: 50; }
#footer-scope b { color:#4a3608; }
main { padding: 20px; max-width: 1180px; margin: 0 auto 60px; }
.card-panel { background: #fff; border: 1px solid var(--panel-border); border-radius: 8px; padding: 16px 18px; margin-bottom: 16px; }
.card-panel h2 { font-size: 17px; margin: 0 0 4px 0; font-weight:normal; font-family:Georgia,serif; color:var(--ink); }
.interp { font-family:Georgia,serif; font-size:13px; color:var(--ink); margin: 6px 0 10px 0; padding: 8px 10px;
  background: var(--card); border-radius:6px; border-left:3px solid var(--accent); }
.cards { display:flex; flex-wrap:wrap; gap:10px; }
.card { background: var(--card); border-radius: 8px; padding: 10px 14px; min-width: 140px; }
.card .v { font-size: 22px; font-weight:bold; font-family:Arial,Helvetica,sans-serif; }
.card .l { font-size: 12px; color: var(--muted); font-family:Arial,Helvetica,sans-serif; margin-top:2px; }
.grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
svg text { fill: var(--muted); font-size: 10px; font-family:Arial,Helvetica,sans-serif; }
.bar { fill: var(--accent); }
.assump-mark { font-size:10px; color:var(--accent); cursor:help; vertical-align:super; }
.badge { display:inline-block; padding: 2px 8px; border-radius:10px; font-size:10px; font-weight:bold;
  font-family:Arial,Helvetica,sans-serif; }
.badge.Chronic { background:#f4dcd9; color:#8a2e23; }
.badge.Event { background:#f6e6d3; color:var(--lead); }
.badge.New { background:#e6e4e1; color:var(--muted); }
.badge.Improving { background:#dcecdf; color: var(--good); }
.badge.Healthy { background:#dcecdf; color: var(--good); }
.badge.WarrantyUrgent { background:#f4dcd9; color:#8a2e23; }
.badge.stale { background:#f6e6d3; color:#8a5a10; }
.badge.HIGH { background:#dcecdf; color:var(--good); }
.badge.MEDIUM { background:#f6e6d3; color:var(--warn); }
.badge.LOW { background:#eee; color:var(--muted); }
#filterbar { display:flex; flex-wrap: wrap; gap:8px; align-items:center; margin-bottom:14px;
  font-family:Arial,Helvetica,sans-serif; }
#filterbar select.sel, #filterbar input { background: #fff; color: var(--ink); border:1px solid var(--panel-border);
  border-radius: 5px; padding: 5px 8px; font-size:12px; }
#filterbar button { background: #fff; color: var(--ink); border:1px solid var(--panel-border);
  border-radius: 5px; padding: 5px 10px; font-size:12px; cursor:pointer; }
.tblscroll { border:1px solid var(--panel-border); border-radius:10px; overflow:auto; }
table.grid { width:100%; border-collapse: collapse; font-size:12px; font-family:Arial,Helvetica,sans-serif; }
table.grid th { position: sticky; top:0; background: var(--thead); text-align:right; padding:7px 10px;
  cursor:pointer; white-space:nowrap; border-bottom: 1px solid var(--panel-border); }
table.grid th.kcol, table.grid td.kcol { text-align:left; position:sticky; left:0; background:var(--thead); z-index:1; }
table.grid td { padding: 6px 10px; border-bottom: 1px solid #f0eeeb; white-space:nowrap; text-align:right; }
table.grid td.kcol { background:#fff; }
table.grid tr:hover td { background: var(--row-hover); cursor:pointer; }
#triage-scroll { height: 60vh; }
.pos-indicator { color: var(--muted); font-size:12px; font-family:Arial,Helvetica,sans-serif; }
.ribbon { display:flex; gap:1px; overflow-x:auto; padding: 4px 0; }
.ribbon .cell { min-width: 7px; height: 22px; flex: 1 0 7px; cursor: default; }
.sig-OUTAGE_FULL { background:#b0392f; } .sig-BLOCK_OUTAGE { background:#c96a2e; }
.sig-SOILING { background:#b5791a; } .sig-TRACKER { background:#7a5ea8; }
.sig-BOS_INTERMITTENT { background:#1d4e6f; } .sig-DEGRADATION { background:#7a5230; }
.sig-UNATTRIBUTED { background:#8a8a8a; } .sig-CURTAILMENT { background:#4a5a70; }
.sig-SNOW { background:#b8d4ea; } .sig-CLIPPING { background:#5a5a6a; }
.sig-NONE, .sig-UNSCORED, .sig-WATCH_NOT_A_FAULT { background: #e6e4e1; }
.legend { display:flex; flex-wrap:wrap; gap:10px; font-size:11px; color:var(--muted); margin-top:6px;
  font-family:Arial,Helvetica,sans-serif; }
.legend span.sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:middle; }
.detail-header { display:flex; justify-content:space-between; align-items:flex-start; }
.detail-header .meta { color: var(--muted); font-size:12px; line-height:1.7; font-family:Arial,Helvetica,sans-serif; }
.navbtns { display:flex; gap:8px; align-items:center; }
.navbtns button { background: #fff; border:1px solid var(--panel-border); color:var(--ink);
  border-radius:6px; padding:6px 12px; cursor:pointer; font-family:Arial,Helvetica,sans-serif; }
textarea.note { width:100%; background: #fff; color:var(--ink); border:1px solid var(--panel-border);
  border-radius:6px; padding:6px; font-family:Arial,Helvetica,sans-serif; font-size:12px; min-height:50px; }
.status-btns button { margin-right:6px; }
.status-btns button.on { outline: 2px solid var(--accent); }
.small { font-size: 11px; color: var(--muted); font-family:Arial,Helvetica,sans-serif; }
.assumption-row td { padding:4px 10px; }
.tip { display:none; position:absolute; background:#fff; border:1px solid var(--tip-border); border-radius:6px;
  padding:8px 10px; font-size:11px; font-family:Arial,Helvetica,sans-serif; box-shadow:0 2px 8px rgba(0,0,0,.08);
  max-width:280px; z-index:100; pointer-events:none; }
.modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:200; display:flex;
  align-items:center; justify-content:center; }
.modal { background:#fff; border-radius:10px; padding:24px 28px; max-width:560px; max-height:80vh; overflow:auto;
  box-shadow:0 8px 30px rgba(0,0,0,.2); }
.modal h2 { font-family:Georgia,serif; font-weight:normal; margin-top:0; }
.modal p { line-height:1.6; }
.modal button.close { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:8px 16px;
  cursor:pointer; font-family:Arial,Helvetica,sans-serif; margin-top:10px; }
.methlink { font-size:11px; color:var(--accent); cursor:pointer; text-decoration:underline; font-family:Arial,Helvetica,sans-serif; }
.footer { font-size:11px; color:#a8a4a0; font-family:Arial,Helvetica,sans-serif; border-top:1px solid var(--panel-border);
  margin-top:20px; padding-top:10px; }
</style>
</head>
<body>

<header id="topbar">
  <h1>PI/PRI Solar Underperformance Explorer</h1>
  <nav class="seg" id="view-nav">
    <button data-view="fleet" class="active">Fleet Overview</button>
    <button data-view="triage">Triage List</button>
    <button data-view="detail">Site Detail</button>
  </nav>
  <span class="pos-indicator" id="pos-indicator"></span>
  <span class="methlink" id="meth-link" style="margin-left:auto">How to read this</span>
  <span class="small" id="progress-indicator"></span>
</header>

<main id="main"></main>

<div id="footer-scope"></div>

<script type="application/json" id="payload-data">__PAYLOAD_JSON__</script>
<script>
const DATA = JSON.parse(document.getElementById('payload-data').textContent);
const SIGNATURES = ["OUTAGE_FULL","BLOCK_OUTAGE","SOILING","TRACKER","BOS_INTERMITTENT","DEGRADATION","UNATTRIBUTED","CURTAILMENT","SNOW","CLIPPING"];
const SIG_LABEL = {OUTAGE_FULL:"Outage",BLOCK_OUTAGE:"Block outage",SOILING:"Soiling",TRACKER:"Tracker",
  BOS_INTERMITTENT:"BOS intermittent",DEGRADATION:"Degradation",UNATTRIBUTED:"Unattributed",
  CURTAILMENT:"Curtailment",SNOW:"Snow",CLIPPING:"Clipping"};

// ---------------------------------------------------------------- state ----
const state = {
  view: 'fleet',
  filters: { year:'', tracking:'', module:'', tier:'', signature:'', confidence:'',
             search:'', peersLt4:false, gap2022:false, noAssetMatch:false },
  sortCol: 'recoverable_usd_yr', sortDir: -1,
  currentSite: null,
};

function loadTriage() {
  try { return JSON.parse(localStorage.getItem('triage_state') || '{}'); } catch(e) { return {}; }
}
function saveTriage(t) { localStorage.setItem('triage_state', JSON.stringify(t)); }
let triage = loadTriage();

// ------------------------------------------------------------- filtering ----
function siteMatches(s, f) {
  if (f.tracking && s.tracking !== f.tracking) return false;
  if (f.module && s.module !== f.module) return false;
  if (f.tier && s.conviction_tier !== f.tier) return false;
  if (f.confidence && !s.confidence.includes(f.confidence)) return false;
  if (f.signature && s.top_signature !== f.signature) return false;
  if (f.peersLt4 && !(s.peers_healthy.some(p => p !== null && p < 4))) return false;
  if (f.gap2022 && !s.data_quality_flags.includes('2022_data_gap')) return false;
  if (f.noAssetMatch && !s.data_quality_flags.includes('no_asset_match')) return false;
  if (f.search) {
    const q = f.search.toLowerCase();
    if (!(s.site.toLowerCase().includes(q) || (s.operator||'').toLowerCase().includes(q))) return false;
  }
  return true;
}
function filteredSites() {
  const f = state.filters;
  let list = DATA.sites.filter(s => siteMatches(s, f));
  const col = state.sortCol, dir = state.sortDir;
  list.sort((a,b) => {
    let av = a[col], bv = b[col];
    if (av === null || av === undefined) av = -Infinity;
    if (bv === null || bv === undefined) bv = -Infinity;
    if (typeof av === 'string') return dir * av.localeCompare(bv);
    return dir * (av - bv);
  });
  return list;
}

// -------------------------------------------------------------- helpers ----
function fmtUsd(v) { if (v===null||v===undefined) return '—'; return '$' + Math.round(v).toLocaleString(); }
function fmtNum(v, nd) { if (v===null||v===undefined) return '—'; return Number(v).toFixed(nd===undefined?2:nd); }
function el(tag, attrs, children) {
  const e = document.createElement(tag);
  for (const k in (attrs||{})) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c => e.appendChild(c instanceof Node ? c : document.createTextNode(String(c))));
  return e;
}
function svg(tag, attrs) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in (attrs||{})) e.setAttribute(k, attrs[k]);
  return e;
}
// Part H: every chart panel gets a title + eyebrow + a one-sentence
// reading of what the reader should conclude, not a restatement of what
// the chart is.
function panelHeader(container, eyebrow, title, interpretation) {
  container.appendChild(el('div', {class:'eyebrow'}, [eyebrow]));
  container.appendChild(el('h2', {}, [title]));
  if (interpretation) container.appendChild(el('div', {class:'interp'}, [interpretation]));
}
// Part H: a small superscript marker on any number that is an assumption,
// not a measurement - present at the point of use, not only in a footer.
function assumptionMark(title) {
  return el('span', {class:'assump-mark', title:title}, [' †']);
}

// ---------------------------------------------------------- mini charts ----
function histogram(values, w, h, threshold) {
  const s = svg('svg', {width:w, height:h, viewBox:`0 0 ${w} ${h}`});
  if (!values.length) return s;
  const bins = 20, min = 0, max = Math.max(1.5, Math.max(...values));
  const counts = new Array(bins).fill(0);
  values.forEach(v => { let b = Math.floor((v-min)/(max-min)*bins); if (b>=bins) b=bins-1; if (b<0) b=0; counts[b]++; });
  const maxC = Math.max(...counts);
  const bw = w/bins;
  counts.forEach((c,i) => {
    const bh = maxC ? (c/maxC)*(h-16) : 0;
    s.appendChild(svg('rect', {x:i*bw+1, y:h-14-bh, width:bw-2, height:bh, class:'bar'}));
  });
  if (threshold !== undefined) {
    const tx = ((threshold-min)/(max-min))*w;
    s.appendChild(svg('line', {x1:tx,y1:0,x2:tx,y2:h-14, stroke:'var(--warn)', 'stroke-dasharray':'3,2'}));
  }
  s.appendChild(svg('text', {x:2, y:h-2}, )).textContent = min.toFixed(1);
  const t2 = svg('text', {x:w-24, y:h-2}); t2.textContent = max.toFixed(1); s.appendChild(t2);
  return s;
}
function barChart(labels, values, w, h) {
  const s = svg('svg', {width:w, height:h, viewBox:`0 0 ${w} ${h}`});
  const maxV = Math.max(1, ...values);
  const bw = w/labels.length;
  values.forEach((v,i) => {
    const bh = (v/maxV)*(h-28);
    s.appendChild(svg('rect', {x:i*bw+2, y:h-20-bh, width:bw-4, height:bh, fill:'var(--accent)'}));
    const t = svg('text', {x:i*bw+bw/2, y:h-8, 'text-anchor':'middle'}); t.textContent = labels[i].length>10?labels[i].slice(0,9)+'…':labels[i];
    s.appendChild(t);
    const tv = svg('text', {x:i*bw+bw/2, y:h-22-bh, 'text-anchor':'middle'}); tv.textContent = v; s.appendChild(tv);
  });
  return s;
}
function sigColor(sig) {
  const map = {OUTAGE_FULL:'#b0392f',BLOCK_OUTAGE:'#c96a2e',SOILING:'#b5791a',TRACKER:'#7a5ea8',
    BOS_INTERMITTENT:'#1d4e6f',DEGRADATION:'#7a5230',UNATTRIBUTED:'#8a8a8a',CURTAILMENT:'#4a5a70',
    SNOW:'#b8d4ea',CLIPPING:'#5a5a6a'};
  return map[sig] || '#888';
}

// ---------------------------------------------------------------- views ----
function renderFleet() {
  const m = document.getElementById('main');
  m.innerHTML = '';
  const k = DATA.kpi;

  const kpiPanel = el('div', {class:'card-panel'});
  panelHeader(kpiPanel, 'PORTFOLIO', 'Fleet KPIs — validation subsample');
  const strip = el('div', {class:'cards'});
  const kpis = [
    ['Scoreable sites (subsample)', k.scoreable_sites_subsample],
    ['Scoreable sites (full fleet)', k.scoreable_sites_fleet.toLocaleString()],
    ['Fleet capacity', k.gw_ac_fleet + ' GWac'],
    ['Site-months scored', k.site_months_scored.toLocaleString()],
    ['Leads (Chronic+Event)', k.leads],
    ['High conviction (Chronic)', k.high_conviction],
    ['Recoverable MWh/yr (subsample)', fmtNum(k.recoverable_mwh_yr,0)],
    ['Recoverable USD/yr (subsample)', fmtUsd(k.recoverable_usd_yr)],
  ];
  kpis.forEach(([l,v]) => strip.appendChild(el('div',{class:'card'},[el('div',{class:'v'},[String(v)]), el('div',{class:'l'},[l])])));
  kpiPanel.appendChild(strip);
  m.appendChild(kpiPanel);

  // funnel
  const funnelPanel = el('div', {class:'card-panel'});
  panelHeader(funnelPanel, 'DATA QUALITY', 'Funnel from full fleet to scoreable sites (Section 4)',
    `${DATA.funnel[0].n_sites.toLocaleString()} raw sites narrow to ${DATA.funnel[DATA.funnel.length-1].n_sites.toLocaleString()} `+
    `scoreable sites after hybrid/lat-lon/capacity/DC:AC gates - everything downstream is scored against this smaller, cleaner set.`);
  const fLabels = DATA.funnel.map(r => r.step);
  const fValues = DATA.funnel.map(r => r.n_sites);
  funnelPanel.appendChild(barChart(fLabels, fValues, 900, 160));
  funnelPanel.appendChild(el('div',{class:'small'},[`GWac at each step: ${DATA.funnel.map(r=>r.gw_ac.toFixed(1)).join(' → ')}`]));
  m.appendChild(funnelPanel);

  // distributions
  const distPanel = el('div', {class:'card-panel grid2'});
  const allPi = DATA.sites.flatMap(s => s.pi.filter(v=>v!==null));
  const allPri = DATA.sites.flatMap(s => s.pri.filter(v=>v!==null));
  const piMedian = allPi.slice().sort((a,b)=>a-b)[Math.floor(allPi.length/2)];
  const priMedian = allPri.slice().sort((a,b)=>a-b)[Math.floor(allPri.length/2)];
  const piDiv = el('div', {});
  panelHeader(piDiv, 'PI', 'PI distribution' + (DATA.meta.pi_provisional ? ' (provisional)' : ''));
  piDiv.appendChild(el('div',{class:'interp'},[
    DATA.meta.pi_provisional
      ? `Half the fleet reads below ${fmtNum(piMedian,2)} against the physical model, while the peer-relative PRI median sits at ${fmtNum(priMedian,2)}. `+
        `That gap is model bias, not fleet underperformance — see the methodology note below. Treat PI as provisional and lead with PRI.`
      : `Median PI is ${fmtNum(piMedian,2)} against the 0.92 decision threshold (dashed line).`
  ]));
  piDiv.appendChild(histogram(allPi, 420, 140, 0.92));
  const priDiv = el('div', {});
  panelHeader(priDiv, 'PRI', 'PRI distribution');
  priDiv.appendChild(el('div',{class:'interp'},[
    `Median PRI is ${fmtNum(priMedian,2)}, peer-relative so it divides out most of the PI model bias — the more trustworthy absolute read at subsample scale.`
  ]));
  priDiv.appendChild(histogram(allPri, 420, 140, 0.92));
  distPanel.appendChild(piDiv); distPanel.appendChild(priDiv);
  m.appendChild(distPanel);
  if (DATA.meta.pi_bias_note) {
    const biasPanel = el('div', {class:'card-panel'});
    panelHeader(biasPanel, 'METHODOLOGY NOTE', 'PI bias diagnostic (Part A2)');
    biasPanel.appendChild(el('div', {class:'interp'}, [DATA.meta.pi_bias_note]));
    m.appendChild(biasPanel);
  }

  // signature counts
  const sigPanel = el('div', {class:'card-panel'});
  panelHeader(sigPanel, 'FAULTS', 'Fault counts by signature (subsample, all years)');
  const sigLabels = Object.keys(DATA.signature_counts);
  const sigValues = sigLabels.map(l => DATA.signature_counts[l]);
  const topSig = sigLabels[sigValues.indexOf(Math.max(...sigValues))];
  sigPanel.appendChild(el('div',{class:'interp'},[
    `${SIG_LABEL[topSig]||topSig} is the largest classified category (${DATA.signature_counts[topSig]} site-months). `+
    (topSig==='SNOW' ? 'See the SNOW-by-state diagnostic in run_report.md before treating this as pure weather.' :
     'Cross-check against the reference episode-per-plant-year profile (run_report.md TEST 22) before treating counts alone as diagnostic.')
  ]));
  sigPanel.appendChild(barChart(sigLabels.map(l=>SIG_LABEL[l]||l), sigValues, 900, 160));
  m.appendChild(sigPanel);

  // by-year stacked (simplified: separate small bars per year per signature count)
  const yearPanel = el('div', {class:'card-panel'});
  panelHeader(yearPanel, 'TREND', 'Fault site-months by year');
  const years = Object.keys(DATA.year_signature_counts).sort();
  const yearTotals = years.map(y => Object.values(DATA.year_signature_counts[y]).reduce((a,b)=>a+b,0));
  yearPanel.appendChild(el('div',{class:'interp'},[
    `Read year-over-year counts alongside site count per year (subsample composition shifts over history) rather than as a fleet-wide trend at this scale.`
  ]));
  yearPanel.appendChild(barChart(years, yearTotals, 700, 140));
  m.appendChild(yearPanel);

  // simple lat/lon scatter "map"
  const mapPanel = el('div', {class:'card-panel'});
  panelHeader(mapPanel, 'GEOGRAPHY — APPROXIMATE', 'Site locations, coloured by conviction tier');
  mapPanel.appendChild(el('div',{class:'interp'},[
    `This is a raw lat/lon scatter, not a projected basemap — read it for rough regional clustering only. A proper US-projected map (Explorer v2 Part C) is a queued follow-up.`
  ]));
  const w=900,h=380;
  const minLat=24, maxLat=50, minLon=-125, maxLon=-66; // rough CONUS bbox
  const s2 = svg('svg',{width:w,height:h,viewBox:`0 0 ${w} ${h}`});
  s2.appendChild(svg('rect',{x:0,y:0,width:w,height:h,fill:'var(--land)',stroke:'var(--panel-border)'}));
  const tierColor = {Chronic:'#8a2e23', Event:'#c96a2e', New:'#8a8a8a', Improving:'#2e7d4f', Healthy:'#4a5a70', 'Warranty-urgent':'#b0392f'};
  DATA.sites.forEach(s => {
    if (s.lat===null||s.lon===null) return;
    const x = ((s.lon-minLon)/(maxLon-minLon))*w;
    const y = h - ((s.lat-minLat)/(maxLat-minLat))*h;
    const c = svg('circle', {cx:x,cy:y,r:Math.max(2,Math.sqrt(s.mwac||10)/3), fill: tierColor[s.conviction_tier]||'#888', opacity:0.85, 'data-site': s.site});
    c.style.cursor='pointer';
    c.addEventListener('click', () => openSite(s.site));
    s2.appendChild(c);
  });
  mapPanel.appendChild(s2);
  const legend = el('div',{class:'legend'});
  Object.entries(tierColor).forEach(([k,v]) => legend.appendChild(el('span',{},[el('span',{class:'sw',style:`background:${v}`}),k])));
  mapPanel.appendChild(legend);
  m.appendChild(mapPanel);

  // hazard curves
  if (DATA.hazard.length) {
    const hazPanel = el('div', {class:'card-panel'});
    panelHeader(hazPanel, 'FORECAST', 'Hazard rate by age band and signature (episodes / exposure-year)');
    hazPanel.appendChild(el('div',{class:'interp'},[
      `Subsample scale (n~100) means these curves are not yet statistically meaningful on their own — read shape (rising vs. falling with age), not the exact rate.`
    ]));
    const bands = [...new Set(DATA.hazard.map(h=>h.age_band))];
    const sigsPresent = [...new Set(DATA.hazard.map(h=>h.signature))];
    const w3=900,h3=200, bw = w3/bands.length;
    const maxRate = Math.max(0.1, ...DATA.hazard.map(h=>h.rate||0));
    const s3 = svg('svg',{width:w3,height:h3,viewBox:`0 0 ${w3} ${h3}`});
    sigsPresent.forEach(sig => {
      let pts = [];
      bands.forEach((b,i) => {
        const rec = DATA.hazard.find(h=>h.signature===sig && h.age_band===b);
        if (rec) pts.push([i*bw+bw/2, h3-20-((rec.rate/maxRate)*(h3-40))]);
      });
      if (pts.length>1) {
        const path = pts.map((p,i)=> (i===0?'M':'L')+p[0]+','+p[1]).join(' ');
        s3.appendChild(svg('path',{d:path, fill:'none', stroke:sigColor(sig), 'stroke-width':2}));
      }
    });
    bands.forEach((b,i)=> s3.appendChild(svg('text',{x:i*bw+bw/2,y:h3-4,'text-anchor':'middle'})).textContent=b);
    hazPanel.appendChild(s3);
    const leg2 = el('div',{class:'legend'});
    sigsPresent.forEach(sig => leg2.appendChild(el('span',{},[el('span',{class:'sw',style:`background:${sigColor(sig)}`}),SIG_LABEL[sig]||sig])));
    hazPanel.appendChild(leg2);
    m.appendChild(hazPanel);
  }

  // assumptions panel
  const aPanel = el('div', {class:'card-panel'});
  panelHeader(aPanel, 'ASSUMPTIONS', 'Every constant, its value, and whether it is measured, assumed or provisional');
  aPanel.appendChild(el('div',{class:'small'},[`Scope: ${DATA.meta.scope}. Weather track this run: ${JSON.stringify(DATA.meta.weather_track_summary)}. Decision-grade: ${DATA.meta.decision_grade} (${DATA.meta.decision_grade_reason})`]));
  const at = el('table', {class:'grid'});
  const thead = el('tr',{},[el('th',{class:'kcol'},['Constant']),el('th',{},['Value']),el('th',{},['Status'])]);
  at.appendChild(thead);
  DATA.meta.assumptions.forEach(a => at.appendChild(el('tr',{class:'assumption-row'},[el('td',{class:'kcol'},[a.name]),el('td',{},[a.value]),el('td',{},[a.status])])));
  aPanel.appendChild(el('div',{class:'tblscroll'},[at]));
  m.appendChild(aPanel);
}

const ROW_H = 28;
function renderTriage() {
  const m = document.getElementById('main');
  m.innerHTML = '';
  const panel = el('div', {class:'card-panel'});
  panelHeader(panel, 'TRIAGE', 'Triage list', 'Click a row to open, or use j/k to move once a row is focused. Default sort is recoverable $/yr descending — the sites worth calling first sort to the top.');

  updatePosIndicator(list, null);

  const cols = [
    ['site','Site'], ['state','State'], ['operator','Operator'], ['mwac','MWac'], ['mwdc','MWdc'],
    ['dcac','DC/AC'], ['tracking','Tracking'], ['cod','COD'], ['years_present','Yrs'],
    ['latest_pi','PI'], ['latest_pri','PRI'], ['latest_d','D'], ['latest_scored_month','Last scored'],
    ['beta','β'], ['beta_t','t'],
    ['fault_months','Fault mo'], ['episode_count','Episodes'], ['top_signature','Top sig'],
    ['confidence','Conf'], ['recoverable_mwh_yr','MWh/yr'], ['recoverable_usd_yr','USD/yr'],
    ['conviction_tier','Tier'], ['warranty_urgent','Warranty'], ['peer_count','Peers'], ['peer_radius_km','Radius km'],
    ['data_quality_flags','DQ flags'],
  ];

  const scrollDiv = el('div', {id:'triage-scroll', class:'tblscroll'});

  const thead = el('tr', {});
  cols.forEach(([key,label], i) => {

      [label + (state.sortCol===key ? (state.sortDir>0?' ▲':' ▼') : '')]);
    thead.appendChild(th);
  });
  table.appendChild(thead);
  scrollDiv.appendChild(table);

  const spacerTop = el('tr', {}); spacerTop.appendChild(el('td', {colspan: cols.length})); table.appendChild(spacerTop);
  const bodyStart = table.rows.length;

  function renderRows() {
    while (table.rows.length > bodyStart) table.deleteRow(bodyStart);
    const scrollTop = scrollDiv.scrollTop;
    const viewH = scrollDiv.clientHeight || 400;
    const first = Math.max(0, Math.floor(scrollTop / ROW_H) - 5);
    const visibleCount = Math.ceil(viewH / ROW_H) + 10;
    const last = Math.min(list.length, first + visibleCount);
    spacerTop.style.height = (first * ROW_H) + 'px';
    spacerTop.querySelector('td').style.padding = '0';
    for (let i=first;i<last;i++) {
      const s = list[i];
      const tr = el('tr', {onclick:()=>openSite(s.site)});
      cols.forEach(([key], ci) => {
        let v = s[key];
        if (key==='recoverable_usd_yr') v = fmtUsd(v);
        else if (['latest_pi','latest_pri','latest_d','dcac'].includes(key)) v = fmtNum(v,3);
        else if (key==='beta') v = v!==null? (v*100).toFixed(2)+'%':'—';
        else if (key==='beta_t') v = fmtNum(v,1);
        else if (key==='top_signature') v = SIG_LABEL[v]||v;
        else if (key==='warranty_urgent') v = v ? '⚠ urgent' : '';
        else if (key==='data_quality_flags') v = (v||[]).join(', ');
        else if (key==='site') {
          const td = el('td',{class:'kcol'},[s.site + (s.stale ? '' : '')]);
          if (s.stale) td.appendChild(el('span',{class:'badge stale', style:'margin-left:6px'},['STALE']));
          tr.appendChild(td); return;
        }
        else if (key==='conviction_tier') { const b=el('span',{class:'badge '+String(v).replace('-','')},[v]); tr.appendChild(el('td',{},[b])); return; }
        else if (v===null||v===undefined) v='—';
        tr.appendChild(el('td', {}, [String(v)]));
      });
      table.appendChild(tr);
    }
    const spacerBot = el('tr', {}); spacerBot.appendChild(el('td',{colspan:cols.length, style:`padding:0;height:${Math.max(0,(list.length-last)*ROW_H)}px`}));
    table.appendChild(spacerBot);
  }
  scrollDiv.addEventListener('scroll', renderRows);
  renderRows();
  panel.appendChild(scrollDiv);
  m.appendChild(panel);
}

function monthlyChart(s) {
  const w=1400,h=280, pad=30;
  const svgEl = svg('svg',{width:'100%',height:h, viewBox:`0 0 ${w} ${h}`, preserveAspectRatio:'none'});
  const n = s.months.length;
  const cw = (w-2*pad)/n;
  const maxMwh = Math.max(1, ...s.e_act.filter(v=>v!==null), ...s.e_exp.filter(v=>v!==null));
  function xAt(i){ return pad + i*cw + cw/2; }
  function yMwh(v){ return h-pad - (v/maxMwh)*(h-2*pad); }
  function yIdx(v){ return h-pad - (Math.min(v,1.3)/1.3)*(h-2*pad); } // PI/PRI axis 0-1.3

  // expected bars (light)
  s.e_exp.forEach((v,i) => { if (v!==null) svgEl.appendChild(svg('rect',{x:xAt(i)-cw*0.35,y:yMwh(v),width:cw*0.7,height:h-pad-yMwh(v), fill:'#e2ded8'})); });
  // actual bars
  s.e_act.forEach((v,i) => { if (v!==null) svgEl.appendChild(svg('rect',{x:xAt(i)-cw*0.2,y:yMwh(v),width:cw*0.4,height:h-pad-yMwh(v), fill:'var(--accent)'})); });
  // 0.92 threshold line on secondary axis
  svgEl.appendChild(svg('line',{x1:pad,y1:yIdx(0.92),x2:w-pad,y2:yIdx(0.92), stroke:'var(--warn)','stroke-dasharray':'4,3'}));
  // PI line
  let piPath=[]; s.pi.forEach((v,i)=>{ if(v!==null) piPath.push([xAt(i), yIdx(v)]); });
  if (piPath.length>1) svgEl.appendChild(svg('path',{d: piPath.map((p,i)=>(i===0?'M':'L')+p[0]+','+p[1]).join(' '), fill:'none', stroke:'var(--good)','stroke-width':1.5}));
  // PRI dots
  s.pri.forEach((v,i)=>{ if(v!==null) svgEl.appendChild(svg('circle',{cx:xAt(i),cy:yIdx(v),r:2.5, fill:'var(--lead)'})); });
  // x labels (yearly ticks)
  s.months.forEach((mo,i)=>{ if (mo.endsWith('-01')) svgEl.appendChild(svg('text',{x:xAt(i),y:h-6,'text-anchor':'middle'})).textContent = mo.slice(0,4); });
  return svgEl;
}

function navStep(list, delta) {
  const idx = list.findIndex(s=>s.site===state.currentSite);
  let next = idx + delta;
  if (next<0) next=0; if (next>=list.length) next=list.length-1;
  openSite(list[next].site);
}

  renderScopeBanner();

}

document.querySelectorAll('#topbar nav button').forEach(b => b.addEventListener('click', () => {
  state.view = b.dataset.view; location.hash = state.view==='detail' && state.currentSite ? 'site='+state.currentSite : '';
  render();
}));

window.addEventListener('keydown', (e) => {
  if (document.activeElement && ['TEXTAREA','INPUT'].includes(document.activeElement.tagName)) return;
  const list = filteredSites();
  if (state.view==='detail') {
    if (e.key==='j' || e.key==='ArrowDown' || e.key==='ArrowRight') { navStep(list,1); e.preventDefault(); }
    else if (e.key==='k' || e.key==='ArrowUp' || e.key==='ArrowLeft') { navStep(list,-1); e.preventDefault(); }
    else if (e.key==='Escape') { state.view='triage'; render(); }
  } else if (state.view==='triage') {
    if (e.key==='Enter' && state.currentSite) openSite(state.currentSite);
  }
});

function parseHash() {
  const h = location.hash.replace('#','');
  const m = h.match(/site=([^&]+)/);
  if (m) { state.currentSite = decodeURIComponent(m[1]); state.view = 'detail'; }
}

// Part H: "How to read this" - dismissible on first load, always
// reachable afterward via the header link. Plain English, four sentences,
// written for an asset manager or CFO, not a PV engineer.
const HOW_TO_READ_HTML = `
<p><b>PI (Performance Index)</b> compares what a plant actually generated to what a physical model of that plant, in that weather, predicts it should generate — 1.00 means it matched the model exactly. <b>PRI (Peer-Relative Index)</b> compares a plant to similar nearby plants instead, which cancels out most modelling error, so it's the more trustworthy number until PI is recalibrated (see the methodology note on the Fleet Overview).</p>
<p><b>D</b> is the deficit — how far below expectation a site ran in a given month — and it's what the fault classifier reads to decide whether a dip looks like snow, an outage, soiling, or something else.</p>
<p><b>Conviction tier</b> (Chronic, Event, New, Improving, Healthy, Warranty-urgent) is SkySpecs' call-priority label for a site: Chronic means a real, sustained problem; Event means a current flag without established history; New means too little data yet to say. No site can be labelled Healthy while it's still carrying recoverable dollar value or an accelerating decline.</p>
<p>Every dollar figure in this tool is a <b>ranking signal, not a quote</b> — it depends on assumed prices, an assumed PPA rate and placeholder recovery fractions until SkySpecs confirms real ones. Check the Assumptions panel before citing a number externally.</p>
`;
function showHowToRead() {
  const backdrop = el('div', {class:'modal-backdrop', onclick:(e)=>{ if(e.target===backdrop) closeModal(); }});
  const modal = el('div', {class:'modal'});
  modal.appendChild(el('h2',{},['How to read this']));
  modal.appendChild(el('div',{html:HOW_TO_READ_HTML}));
  modal.appendChild(el('button',{class:'close', onclick:closeModal},['Got it']));
  backdrop.appendChild(modal);
  backdrop.id='how-to-read-modal';
  document.body.appendChild(backdrop);
}
function closeModal() {
  const m = document.getElementById('how-to-read-modal');
  if (m) m.remove();
  localStorage.setItem('seen_how_to_read', '1');
}
document.getElementById('meth-link').addEventListener('click', showHowToRead);

parseHash();
render();
if (!localStorage.getItem('seen_how_to_read')) showHowToRead();
</script>
</body>
</html>
