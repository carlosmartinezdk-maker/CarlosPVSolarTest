<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SSI CEO Cockpit</title>
<style>
:root {
  --ink: #2b2b2b; --accent: #1d4e6f; --card: #f1efec; --bg: #fbfafa;
  --muted: #7a756c; --warn: #b0392f; --good: #2e7d4f; --panel-border: #e2ddd3;
  --stroke: #ffffff; --land: #d8d3c8;
  /* B5: one relationship palette, used identically everywhere (map, cards,
     coverage table, every chart) - Whitespace carries the accent colour
     because it is the opportunity, the thing the eye should land on. */
  --rel-customer: #2e7d4f; --rel-prospect: #8a5a12; --rel-whitespace: #1d4e6f;
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family: Georgia, serif; }
.arial, button, select, input, table, .eyebrow, .badge, th, .small, nav, .seg { font-family: Arial, Helvetica, sans-serif; }
h1,h2,h3 { font-family: Georgia, serif; font-weight: normal; }
.eyebrow { font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--accent); font-weight:bold; }
#topbar-wrap { position: sticky; top:0; z-index:50; background:var(--bg); }
header#topbar { border-bottom:1px solid var(--panel-border); padding:12px 24px; display:flex; align-items:center; gap:16px; }
header#topbar h1 { font-size:19px; margin:0; }
.seg { display:flex; gap:0; border:1px solid var(--panel-border); border-radius:6px; overflow:hidden; }
.seg button { background:var(--bg); border:none; border-right:1px solid var(--panel-border); color:var(--muted);
  padding:7px 14px; cursor:pointer; font-size:12.5px; }
.seg button:last-child { border-right:none; }
.seg button.active { background:var(--accent); color:#fff; }
main#main { padding:20px 24px 60px; max-width:1400px; margin:0 auto; }
.card-panel { background:#fff; border:1px solid var(--panel-border); border-radius:8px; padding:18px 20px; margin-bottom:18px; }
.small { font-size:12px; color:var(--muted); }
.interp { font-size:14px; line-height:1.5; margin:8px 0; }
.cards { display:flex; flex-wrap:wrap; gap:14px; margin:10px 0; }
.card { background:var(--card); border-radius:8px; padding:14px 18px; min-width:140px; flex:1; }
.card .v { font-size:26px; font-weight:bold; font-family:Arial,Helvetica,sans-serif; }
.card .l { font-size:11.5px; color:var(--muted); margin-top:4px; }
table.grid { border-collapse:collapse; width:100%; font-size:13px; }
table.grid th { text-align:right; padding:6px 10px; border-bottom:2px solid var(--ink); font-size:11px;
  text-transform:uppercase; letter-spacing:.06em; color:var(--muted); position:sticky; top:0; background:#fff; }
table.grid td { text-align:right; padding:6px 10px; border-bottom:1px solid var(--panel-border); }
table.grid th.kcol, table.grid td.kcol { text-align:left; }
.tblscroll { overflow:auto; max-height:520px; }
.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:10.5px; font-weight:bold;
  text-transform:uppercase; letter-spacing:.04em; }
.badge.Customer { background:#d8ead9; color:var(--rel-customer); }
.badge.Prospect { background:#fbe8cf; color:var(--rel-prospect); }
.badge.Whitespace { background:var(--rel-whitespace); color:#fff; }
.badge.FOCUS_NOW { background:var(--accent); color:#fff; }
.badge.EXPAND { background:#2e7d4f; color:#fff; }
.badge.NEW_LOGO { background:#8a5a12; color:#fff; }
.badge.NURTURE { background:#c9c2b3; color:#4a4536; }
.badge.PARK { background:#e6e1d8; color:var(--muted); }
.badge.suspect { background:#f4d9d4; color:#8a2e1e; margin-left:6px; }
.badge.unresolved { background:var(--warn); color:#fff; }
.acct-card { background:#fff; border:1px solid var(--panel-border); border-radius:8px; padding:16px 18px; margin-bottom:12px; cursor:pointer; }
.acct-card:hover { border-color:var(--accent); }
.acct-card .title { font-size:17px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.acct-card .meta { font-size:12.5px; color:var(--muted); margin:4px 0 10px; font-family:Arial,Helvetica,sans-serif; }
.acct-card .three { display:flex; gap:24px; margin-top:10px; }
.acct-card .three .num { font-family:Arial,Helvetica,sans-serif; }
.acct-card .three .num .v { font-size:19px; font-weight:bold; }
.acct-card .three .num .l { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
.filterbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; font-size:12.5px; }
.sel { padding:5px 8px; border:1px solid var(--panel-border); border-radius:5px; font-size:12.5px; background:#fff; }
button.btn { background:var(--accent); color:#fff; border:none; border-radius:5px; padding:7px 14px; cursor:pointer; font-size:12.5px; }
button.btn.secondary { background:#fff; color:var(--accent); border:1px solid var(--accent); }
.legend { display:flex; gap:16px; font-size:12px; margin-top:8px; flex-wrap:wrap; }
.legend .sw { display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:5px; vertical-align:middle; }
.geo { cursor:default; }
.map-canvas { width:100%; height:auto; aspect-ratio: 975 / 610; display:block; cursor:default; }
.map-tooltip { position:absolute; pointer-events:none; background:#fff; border:1px solid var(--panel-border);
  border-radius:6px; padding:8px 10px; font-size:12px; box-shadow:0 2px 8px rgba(0,0,0,.12); z-index:10; max-width:240px; }
.pitch-header { display:flex; justify-content:space-between; align-items:flex-start; }
.defs-panel { margin-bottom:14px; }
.defs-panel summary { cursor:pointer; font-size:13px; font-weight:bold; color:var(--accent); font-family:Arial,Helvetica,sans-serif; }
.defs-body { margin-top:10px; padding-top:8px; border-top:1px solid var(--panel-border); }
.defs-body h3 { font-size:13px; margin:12px 0 6px; }
.defs-body h3:first-child { margin-top:0; }
.defs-pre { font-family:'Courier New',monospace; font-size:11.5px; line-height:1.5; white-space:pre-wrap;
  background:var(--card); padding:10px 12px; border-radius:6px; }
.band-tile.active { outline:2px solid var(--accent); }
tr.kb-focus td { background:var(--card); box-shadow: inset 2px 0 0 var(--accent); }
.play-box { border:1px solid var(--panel-border); border-radius:6px; padding:12px 14px; margin-bottom:10px; }
table.grid th:hover { color:var(--ink); }
table.grid td.still-avail, table.grid th.still-avail { font-weight:bold; color:var(--accent); }
tr.rep-account-row td { color:var(--muted); font-size:12.5px; }
.print-btn { display:inline-block; }
@page { size: A4; margin: 10mm; }
@media print {
  #topbar-wrap, #header-controls, .no-print { display:none !important; }
  main#main { padding:0; max-width:100%; }
  .card-panel { border:none; page-break-inside:avoid; padding:4px 0; margin-bottom:5px; }
  /* B6: the pitch page prints to one A4 side - nav/filters are already
     covered by .no-print above; the long site-level tables (warranty can
     run to hundreds of rows) are dropped from print, keeping only the
     business-document essentials (header, plays, do-nothing-vs-engage,
     the five worst sites, why this offering). Fonts/spacing shrink too -
     screen sizing has room to breathe that a single printed page doesn't. */
  .print-hide { display:none !important; }
  h2 { font-size: 14px; margin: 1px 0 2px !important; }
  .eyebrow { font-size: 9px; }
  .small, table.grid { font-size: 10.5px; }
  .interp { font-size: 12px; margin: 3px 0; }
  .play-box { padding:6px 8px; margin-bottom:4px; }
  table.grid th, table.grid td { padding:3px 6px; }
  svg { max-height: 130px; }
}
</style>
</head>
<body>

<div id="topbar-wrap">
<header id="topbar">
  <h1>SSI CEO Cockpit</h1>
  <nav class="seg" id="view-nav">
    <button data-view="market" class="active">Addressable Market</button>
    <button data-view="accounts">Priority Accounts</button>
    <button data-view="pitch">Pitch Page</button>
    <button data-view="evidence">Evidence</button>
    <button data-view="coverage">Coverage &amp; Books</button>
  </nav>
  <span class="small" id="scope-note" style="margin-left:auto"></span>
</header>
<div class="small" id="vintage-note" style="padding:4px 24px; border-bottom:1px solid var(--panel-border)"></div>
</div>

<main id="main"></main>

const SIG_LABEL = {OUTAGE_FULL:"Outage",BLOCK_OUTAGE:"Block outage",SOILING:"Soiling",TRACKER:"Tracker",
  BOS_INTERMITTENT:"BOS intermittent",UNATTRIBUTED:"Unattributed"};
const CSS_ROOT = getComputedStyle(document.documentElement);
const relColor = k => CSS_ROOT.getPropertyValue('--rel-' + k.toLowerCase()).trim();
const REL_COLOR = {Customer:relColor('Customer'), Prospect:relColor('Prospect'), Whitespace:relColor('Whitespace'), below_floor:"#c9c2b3"};
const REL_KEYS = ['Customer', 'Prospect', 'Whitespace'];

const US_TOPO = JSON.parse(document.getElementById('us-states-topo').textContent);
const STATE_FEATURES = topojson.feature(US_TOPO, US_TOPO.objects.states).features;
const STATE_MESH = topojson.mesh(US_TOPO, US_TOPO.objects.states, (a,b) => a !== b);
const GEO_PATH = d3.geoPath();
const STATE_MESH_PATH = GEO_PATH(STATE_MESH);
const ALBERS_PROJ = d3.geoAlbersUsa().scale(1300).translate([975/2, 610/2]);

// ---------------------------------------------------------------- state ----
// A10: FOCUS_NOW starts selected so Priority Accounts is never empty on load.
const state = { view: 'market', currentAccount: null, sortCol: 'coi_3yr_usd', sortDir: -1,
  filters: {relationship:'', region:'', focus:'FOCUS_NOW'},
  showTechnicalDetail: false, // A6c: persists across account navigation, not reset per render
  evSortCol: 'cost_of_inaction_usd', evSortDir: -1, // A8: Evidence's own site table sort (separate from Priority Accounts')
  kbFocusIdx: null }; // B6: j/k keyboard nav on the Priority Accounts table
let accountsListCache = []; // B6: latest filtered/sorted account list, for the keyboard handler below

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  for (const k in (attrs||{})) {
    const v = attrs[k];
    if (v === undefined) continue; // e.g. {selected: cond?true:undefined} - a present-but-undefined
                                    // attribute would still setAttribute('selected','undefined'),
                                    // which HTML treats as "selected" regardless of the string value
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  (children||[]).forEach(c => e.appendChild(c instanceof Node ? c : document.createTextNode(String(c))));
  return e;
}
function svg(tag, attrs) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in (attrs||{})) e.setAttribute(k, attrs[k]);
  return e;
}
// A3: one number format, enforced globally - every rendered number routes
// through this object. Comma for thousands, dot for decimals, never a bare
// 0 for missing data (em-dash instead). See CEO_COCKPIT_REVISIONS_PASS2.md
// Part A3 for the per-type decimal-place rules this implements.
function missing(v) { return v===null || v===undefined || (typeof v==='number' && Number.isNaN(v)); }
const fmt = {
  usd(v) {
    if (missing(v)) return '—';
    const sign = v < 0 ? '-' : '', av = Math.abs(v);
    if (av >= 1e6) return sign + '$' + (av/1e6).toFixed(1) + 'M';
    return sign + '$' + Math.round(av).toLocaleString('en-US');
  },
  mwdc(v) { if (missing(v)) return '—'; return Number(v).toLocaleString('en-US', {minimumFractionDigits:1, maximumFractionDigits:1}); },
  count(v) { if (missing(v)) return '—'; return Math.round(v).toLocaleString('en-US'); },
  pct(v) { if (missing(v)) return '—'; return (100*v).toFixed(1) + '%'; },
  ratio(v) { if (missing(v)) return '—'; return Number(v).toFixed(1) + 'x'; },
  weeks(v) { if (missing(v)) return '—'; return Math.round(v).toLocaleString('en-US') + ' weeks'; },
  pi(v) { if (missing(v)) return '—'; return Number(v).toFixed(3); },
  pri(v) { if (missing(v)) return '—'; return Number(v).toFixed(3); },
  beta(v) { if (missing(v)) return '—'; return Number(v).toFixed(4); },
  eta(v) { if (missing(v)) return '—'; return Number(v).toFixed(2); },
  raw(v, nd) { if (missing(v)) return '—'; return Number(v).toFixed(nd===undefined?1:nd); },
};
// B4: a CEO will ask how current this is - EIA publishes 2-3 months in
// arrears, so this must be on screen, not left implicit.
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthLabel(yyyymm) {
  if (!yyyymm) return 'Production data vintage unknown · EIA-923 publishes 2-3 months in arrears.';
  const [y, mo] = yyyymm.split('-');
  const name = MONTH_NAMES[parseInt(mo, 10) - 1] || mo;
  return `Production data through ${name} ${y} · EIA-923 publishes 2-3 months in arrears.`;
}
function panelHeader(panel, eyebrow, title, sub) {
  panel.appendChild(el('div', {class:'eyebrow'}, [eyebrow]));
  panel.appendChild(el('h2', {style:'margin:2px 0 4px'}, [title]));
  if (sub) panel.appendChild(el('div', {class:'small'}, [sub]));
}
function accountByName(name) { return DATA.accounts.find(a => a.owner_entity === name); }

// ----------------------------------------------------------- site map (A4) --
// 6,200 sites is too many for per-circle SVG hover handlers. Every site is
// drawn to one <canvas>; a single delegated mousemove hit-tests against a
// uniform-grid spatial index (a flat quadtree - cheap to build, O(1) average
// lookup for point data at this density) instead of scanning all points.
const MAP_W = 975, MAP_H = 610;
function buildSiteGrid(points, cellSize) {
  const grid = new Map();
  points.forEach((p, i) => {
    const key = Math.floor(p.x / cellSize) + ',' + Math.floor(p.y / cellSize);
    if (!grid.has(key)) grid.set(key, []);
    grid.get(key).push(i);
  });
  return { grid, cellSize };
}
function nearestSite(index, points, x, y) {
  const { grid, cellSize } = index;
  const cx = Math.floor(x / cellSize), cy = Math.floor(y / cellSize);
  let best = -1, bestD = Infinity;
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
    const bucket = grid.get((cx+dx) + ',' + (cy+dy));
    if (!bucket) continue;
    for (const i of bucket) {
      const p = points[i];
      const d = Math.hypot(p.x - x, p.y - y);
      if (d <= p.r + 1.5 && d < bestD) { bestD = d; best = i; }
    }
  }
  return best;
}
// Pass 3 §1: Geography subsection state - separate from the rest of
// `state` only in that these four are read/written from several render
// functions (renderMarket, renderSiteMap, the geo table), so they're
// lazily initialised once here rather than duplicated at each call site.
function ensureGeoState() {
  if (!state.mapFilters) state.mapFilters = {Customer:true, Prospect:true, Whitespace:true};
  if (!state.geoView) state.geoView = 'map';
  if (!state.geoScope) state.geoScope = 'floor';
  if (!state.geoSortCol) { state.geoSortCol = 'total_ssi_potential_usd_yr'; state.geoSortDir = -1; }
}

// Pass 3 §1.3: one relationship toggle, shared between the map and table
// presentations - `items` is whatever's currently in view (sites for the
// map, accounts for the table) so the counts always match what's visible.
function renderRelationshipToggle(items) {
  const legend = el('div', {class:'legend', style:'margin-bottom:12px'});
  REL_KEYS.forEach(k => {
    const n = items.filter(x => x.relationship === k).length;
    const on = state.mapFilters[k];
    legend.appendChild(el('span', {style:`cursor:pointer; opacity:${on?1:0.4}`,
      onclick:()=>{ state.mapFilters[k] = !state.mapFilters[k]; render(); }},
      [el('span',{class:'sw',style:`background:${REL_COLOR[k]}`}), `${k} (${fmt.count(n)})`]));
  });
  return legend;
}

function renderSiteMap(sites) {
  const wrap = el('div', {style:'position:relative'});
  const canvas = document.createElement('canvas');
  canvas.className = 'map-canvas';
  wrap.appendChild(canvas);
  const tooltip = el('div', {class:'map-tooltip', style:'display:none'});
  wrap.appendChild(tooltip);

  ensureGeoState();
  // B6: empty state - every class toggled off shouldn't just read as a
  // blank map with no explanation.
  const emptyNote = el('div', {class:'small', style:'position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); display:none'},
    ['All relationship classes are hidden - click a legend entry above to show sites.']);
  wrap.appendChild(emptyNote);

  const maxMwdc = Math.max(1, ...sites.map(s => s.mwdc || 0));
  const radiusOf = mwdc => 2 + 14 * Math.sqrt((mwdc||0) / maxMwdc);
  const points = sites.map(s => {
    const p = ALBERS_PROJ([s.lon, s.lat]);
    return p ? {x:p[0], y:p[1], r:radiusOf(s.mwdc), site:s} : null;
  });
  const compact = points.filter(p => p !== null);
  const gridIdx = buildSiteGrid(compact, 24);

  function draw() {
    emptyNote.style.display = REL_KEYS.some(k => state.mapFilters[k]) ? 'none' : 'block';
    const dpr = window.devicePixelRatio || 1;
    const cssW = canvas.clientWidth || 900, cssH = cssW * MAP_H / MAP_W;
    canvas.width = cssW * dpr; canvas.height = cssH * dpr;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr * cssW / MAP_W, 0, 0, dpr * cssW / MAP_W, 0, 0);
    ctx.clearRect(0, 0, MAP_W, MAP_H);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--land').trim();
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--stroke').trim();
    ctx.lineWidth = 1;
    STATE_FEATURES.forEach(f => { const p = new Path2D(GEO_PATH(f)); ctx.fill(p); ctx.stroke(p); });
    ctx.stroke(new Path2D(STATE_MESH_PATH));
    compact.forEach(p => {
      if (!state.mapFilters[p.site.relationship]) return;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 2 * Math.PI);
      ctx.fillStyle = REL_COLOR[p.site.relationship] || '#888';
      ctx.globalAlpha = p.site.in_scope ? 0.85 : 0.35;
      ctx.fill();
      ctx.globalAlpha = 1;
    });
  }
  // deferred: canvas isn't attached to the document yet (the caller appends
  // the returned wrapper after this function returns), so clientWidth would
  // read 0 if drawn synchronously here.
  requestAnimationFrame(draw);
  const onResize = () => { if (!canvas.isConnected) { window.removeEventListener('resize', onResize); return; } draw(); };
  window.addEventListener('resize', onResize);

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (MAP_W / rect.width);
    const y = (e.clientY - rect.top) * (MAP_H / rect.height);
    const i = nearestSite(gridIdx, compact, x, y);
    if (i < 0 || !state.mapFilters[compact[i].site.relationship]) {
      tooltip.style.display = 'none';
      canvas.style.cursor = 'default';
      return;
    }
    const s = compact[i].site;
    tooltip.innerHTML = '';
    tooltip.appendChild(el('div', {style:'font-weight:bold'}, [s.owner]));
    tooltip.appendChild(el('div', {}, [s.site]));
    tooltip.appendChild(el('div', {}, [`${fmt.mwdc(s.mwdc)} MWdc · COD ${s.cod || '—'} · ${s.state || '—'}`]));
    if (!s.in_scope) tooltip.appendChild(el('div', {class:'small'}, ['below 250 MWdc engagement floor']));
    tooltip.style.left = (e.clientX - rect.left + 14) + 'px';
    tooltip.style.top = (e.clientY - rect.top + 10) + 'px';
    tooltip.style.display = 'block';
    canvas.style.cursor = accountByName(s.owner) ? 'pointer' : 'default';
  });
  canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; canvas.style.cursor = 'default'; });
  canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (MAP_W / rect.width);
    const y = (e.clientY - rect.top) * (MAP_H / rect.height);
    const i = nearestSite(gridIdx, compact, x, y);
    if (i < 0) return;
    const s = compact[i].site;
    if (!accountByName(s.owner)) return;
    state.currentAccount = s.owner; state.view = 'pitch'; render();
  });

  // Pass 3 §1.3: the relationship toggle now lives once, shared between
  // map and table, in the Geography subsection - not duplicated here.
  return wrap;
}

// ---------------------------------------------------------------- render ----
function render() {
  document.querySelectorAll('#topbar nav button').forEach(b=>b.classList.toggle('active', b.dataset.view===state.view));
  document.getElementById('scope-note').textContent =
    `${fmt.count(DATA.meta.in_scope_accounts)} accounts ≥250 MWdc · ${fmt.count(DATA.meta.matched_gtm_accounts)} GTM accounts matched · generated from the ${fmt.count(DATA.meta.total_accounts_all)}-owner fleet`;
  document.getElementById('vintage-note').textContent = monthLabel(DATA.meta.data_through_month);
  const m = document.getElementById('main');
  m.innerHTML = '';
  if (state.view === 'market') renderMarket(m);
  else if (state.view === 'accounts') renderAccounts(m);
  else if (state.view === 'pitch') renderPitch(m);
  else if (state.view === 'evidence') renderEvidence(m);
  else if (state.view === 'coverage') renderCoverage(m);
  // B6 / Pass 3 §1.1: deep links - the pitch page is the artefact people
  // share, so its URL always reflects the selected account; the
  // Addressable Market screen's URL reflects the active Map|Table
  // presentation, so a link opens on the view the sender was looking at.
  // replaceState (not pushState) so browsing doesn't spam back-button history.
  let hash = '';
  if (state.view === 'pitch' && state.currentAccount) hash = '#account=' + encodeURIComponent(state.currentAccount);
  else if (state.view === 'market') hash = '#geo=' + state.geoView;
  if (location.hash !== hash) history.replaceState(null, '', location.pathname + location.search + hash);
}

document.querySelectorAll('#topbar nav button').forEach(b => b.addEventListener('click', () => {
  state.view = b.dataset.view; render();
}));

// B6: keyboard nav on the Priority Accounts table - j/k move, Enter opens
// the focused row's pitch page, Escape clears focus. Registered once at
// document level (not inside renderAccounts) so it doesn't stack a new
// listener on every re-render; scoped to the accounts view at fire time.
document.addEventListener('keydown', e => {
  if (state.view !== 'accounts' || !accountsListCache.length) return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'SELECT' || tag === 'INPUT') return; // don't steal keys from form controls
  if (!['j','k','Enter','Escape'].includes(e.key)) return;
  // a focused <button> (e.g. the nav tab just clicked) treats Enter as "activate
  // me" by default, which would fire after this handler and undo the navigation
  // below - suppress that default action for the keys this handler owns.
  e.preventDefault();
  if (e.key === 'j') {
    state.kbFocusIdx = Math.min((state.kbFocusIdx ?? -1) + 1, accountsListCache.length - 1);
    render();
    document.querySelector('tr.kb-focus')?.scrollIntoView({block:'nearest'});
  } else if (e.key === 'k') {
    state.kbFocusIdx = Math.max((state.kbFocusIdx ?? 0) - 1, 0);
    render();
    document.querySelector('tr.kb-focus')?.scrollIntoView({block:'nearest'});
  } else if (e.key === 'Enter' && state.kbFocusIdx != null && accountsListCache[state.kbFocusIdx]) {
    state.currentAccount = accountsListCache[state.kbFocusIdx].owner_entity; state.view = 'pitch'; render();
  } else if (e.key === 'Escape') {
    state.kbFocusIdx = null; render();
  }
});

// =============================================================== SCREEN 1 ==
function renderMarket(m) {
  const w = DATA.screen1.waterfall;
  const headline = el('div', {class:'card-panel'});
  panelHeader(headline, 'ADDRESSABLE MARKET', 'How big, how real, and where',
    'Denominator: all figures below are the ' + fmt.count(DATA.meta.in_scope_accounts) + ' accounts at or above the 250 MWdc engagement floor - the remaining ' +
    fmt.count(DATA.meta.total_accounts_all - DATA.meta.in_scope_accounts) + ' owners are below it and out of scope for this tool.');
  const strip = el('div', {class:'cards'});
  [
    ['3-yr cost of inaction (in scope)', fmt.usd(w.in_scope_coi)],
    // Pass 3 §2.2: these answer two different questions ("what would we
    // charge for the one product we lead with" vs "what is this fleet
    // worth at full attach") and must never be confused for one another -
    // shown side by side, separately labelled, never summed.
    ['Lead-offering fee/yr', fmt.usd(DATA.meta.in_scope_fee_potential_usd)],
    ['Total potential at full attach/yr', fmt.usd(DATA.meta.in_scope_total_ssi_potential_usd)],
    ['Accounts in scope', fmt.count(DATA.meta.in_scope_accounts)],
    ['Whitespace share of ALL CoI (est.)', fmt.pct(DATA.meta.whitespace_share_all_estimate)],
  ].forEach(([l,v]) => strip.appendChild(el('div',{class:'card'},[el('div',{class:'v'},[String(v)]), el('div',{class:'l'},[l])])));
  headline.appendChild(strip);
  headline.appendChild(el('div', {class:'small', style:'margin-top:6px'},
    [`Whitespace share is an estimate bounded by GTM-account matching quality - only ${fmt.count(DATA.meta.matched_gtm_accounts)} of ${fmt.count(DATA.meta.total_accounts_all)} owners matched to a GTM record. Read it as an upper bound, not a settled figure - it will fall as matching improves. "Total potential at full attach" assumes every offering at every site, software (SaaS+SCADA) plus inspection at its reliability-optimal frequency - see Coverage & Books for the per-rep breakdown.`]));
  m.appendChild(headline);

  const waterfallPanel = el('div', {class:'card-panel'});
  panelHeader(waterfallPanel, 'STRATEGY', 'The waterfall: total cost of inaction, in scope, by relationship');
  const wf = [
    ['Total CoI (all owners)', w.total_coi_all, '#c9c2b3'],
    ['In scope (≥250 MWdc)', w.in_scope_coi, 'var(--accent)'],
    ['Customer', w.customer_coi, REL_COLOR.Customer],
    ['Prospect', w.prospect_coi, REL_COLOR.Prospect],
    ['Whitespace', w.whitespace_coi, REL_COLOR.Whitespace],
  ];
  const maxV = Math.max(...wf.map(x=>x[1]));
  const bw = 160, gap=24, h=220, pad=40, leftAxis=44, bottomAxis=40;
  const chartW = wf.length*(bw+gap), chartH = h+50;
  const s = svg('svg', {width: chartW+leftAxis, height:chartH+bottomAxis, viewBox:`0 0 ${chartW+leftAxis} ${chartH+bottomAxis}`});
  wf.forEach(([label,val,color],i) => {
    const bh = (val/maxV)*h;
    s.appendChild(svg('rect', {x:leftAxis+i*(bw+gap)+gap/2, y:h+pad-bh, width:bw, height:bh, fill:color, rx:4}));
    const t = svg('text', {x:leftAxis+i*(bw+gap)+gap/2+bw/2, y:h+pad-bh-8, 'text-anchor':'middle', style:'font:bold 13px Arial'});
    t.textContent = fmt.usd(val); s.appendChild(t);
    const l = svg('text', {x:leftAxis+i*(bw+gap)+gap/2+bw/2, y:h+pad+16, 'text-anchor':'middle', style:'font:11px Arial; fill:#7a756c'});
    l.textContent = label; l.setAttribute('title', label); s.appendChild(l);
  });
  s.appendChild(svg('line', {x1:leftAxis, y1:h+pad, x2:leftAxis, y2:0, stroke:'var(--panel-border)', 'stroke-width':1}));
  const yTitle = svg('text', {x:-((h+pad)/2), y:16, 'text-anchor':'middle', transform:'rotate(-90)', style:'font:11px Arial; fill:#7a756c'});
  yTitle.textContent = 'Cost of inaction (USD)'; s.appendChild(yTitle);
  const xTitle = svg('text', {x:leftAxis+chartW/2, y:chartH+bottomAxis-10, 'text-anchor':'middle', style:'font:11px Arial; fill:#7a756c'});
  xTitle.textContent = 'Segment'; s.appendChild(xTitle);
  waterfallPanel.appendChild(s);
  m.appendChild(waterfallPanel);

  // Pass 3 Part 1: Geography subsection - three independent controls,
  // coarse to fine. Control hierarchy matters: scope filters the universe,
  // relationship filters within it, map/table only changes presentation -
  // nesting them in any other order "produces a control panel nobody
  // trusts" (spec's own words).
  ensureGeoState();
  const geoPanel = el('div', {class:'card-panel'});
  panelHeader(geoPanel, 'GEOGRAPHY', 'Every US solar site and account - map shows the shape, table answers "show me the list"');

  // §1.1 Map | Table
  const viewSeg = el('div', {class:'seg', style:'margin-bottom:12px; width:fit-content'});
  [['map','Map'],['table','Table']].forEach(([v,l]) =>
    viewSeg.appendChild(el('button', {class: state.geoView===v?'active':'', onclick:()=>{state.geoView=v; render();}}, [l])));
  geoPanel.appendChild(viewSeg);

  // §1.2 Scope - labelled as granularity, not a filter
  const scopeWrap = el('div', {class:'cards', style:'margin-bottom:10px'});
  const scopeOpts = [
    ['all', 'All accounts', `${fmt.count(DATA.meta.total_accounts_all)} entities, ${fmt.usd(DATA.meta.total_coi_all_usd)} cost of inaction. Most are single-site project vehicles.`],
    ['floor', '≥ 250 MWdc', `${fmt.count(DATA.meta.in_scope_accounts)} accounts, ${fmt.usd(DATA.meta.in_scope_coi_usd)}. ${fmt.pct(DATA.meta.in_scope_accounts/DATA.meta.total_accounts_all)} of the entities hold ${fmt.pct(DATA.meta.in_scope_coi_usd/DATA.meta.total_coi_all_usd)} of the value.`],
  ];
  scopeOpts.forEach(([v,label,copy]) => {
    const active = state.geoScope === v;
    scopeWrap.appendChild(el('div', {class:'card'+(active?' band-tile active':''), style:'cursor:pointer; flex:1; min-width:260px',
      onclick:()=>{state.geoScope=v; render();}},
      [el('div',{class:'v', style:'font-size:15px'},[label]), el('div',{class:'l', style:'white-space:normal; margin-top:4px'},[copy])]));
  });
  geoPanel.appendChild(scopeWrap);

  // §1.3 Relationship - beneath scope, above the map/table itself
  const geoScopedSites = state.geoScope === 'floor' ? DATA.screen1.map_sites.filter(s=>s.in_scope) : DATA.screen1.map_sites;
  const geoScopedAccounts = state.geoScope === 'floor' ? DATA.accounts : DATA.screen1.all_accounts;
  geoPanel.appendChild(renderRelationshipToggle(state.geoView === 'map' ? geoScopedSites : geoScopedAccounts));

  if (state.geoView === 'map') {
    geoPanel.appendChild(el('div', {class:'small', style:'margin-bottom:8px'},
      ['Colour = relationship, size = MWdc (square-root scaled).' +
       (state.geoScope==='all' ? ' Out-of-scope sites (below the 250 MWdc floor) render at lower opacity for context, not as opportunity.' : '')]));
    geoPanel.appendChild(renderSiteMap(geoScopedSites));
  } else {
    geoPanel.appendChild(renderGeoAccountTable(geoScopedAccounts));
  }
  m.appendChild(geoPanel);
}

// Pass 3 §1.1: account-level table presentation of the Geography subsection.
const GEO_COLS = [
  ['owner_entity', 'Account', false], ['relationship', 'Relationship', false],
  ['n_sites', 'Sites', true], ['mwdc', 'MWdc', true], ['_states', 'States', false],
  ['_top_issue', 'Top issue', false], ['_offering', 'Recommended offering', false],
  ['coi_3yr_usd', 'Their loss (3-yr)', true],
  ['software_revenue_usd_yr', 'Software revenue/yr', true],
  ['inspection_revenue_usd_yr', 'Inspection revenue/yr', true],
  ['total_ssi_potential_usd_yr', 'Total SSI potential/yr', true],
  ['payback_weeks', 'Payback', true], ['confidence', 'Confidence', false],
];
function renderGeoAccountTable(accounts) {
  const wrap = el('div', {});
  let list = accounts.filter(a => state.mapFilters[a.relationship]);
  list = list.map(a => ({...a, _top_issue: SIG_LABEL[a.top_signature]||a.top_signature||'',
    _offering: SIGNATURE_OFFERING[a.top_signature]||'', _states: (a.states||[]).join(', ')}));
  const numericCol = Object.fromEntries(GEO_COLS.map(([c,,n])=>[c,n]));
  list = sortRows(list, state.geoSortCol, !!numericCol[state.geoSortCol], state.geoSortDir);

  wrap.appendChild(el('div', {class:'small', style:'margin-bottom:8px'},
    [list.length ? `${fmt.count(list.length)} accounts shown.` : 'No accounts match this filter combination.']));
  if (!list.length) return wrap;

  wrap.appendChild(exportBtn(GEO_COLS.map(c=>c[0]), list, 'ceo_cockpit_geography.csv'));

  OUTAGE_FULL:'SCADA Monitoring', TRACKER:'Recurrent Inspection', BOS_INTERMITTENT:'Recurrent Inspection',
  UNATTRIBUTED:'Recurrent Inspection'};

};

  FOCUS_NOW: 'Large 3-yr loss (≥$10M), fast payback (<8 weeks), and confidence is not low.',
  EXPAND: 'An existing customer missing the product their dominant fault pattern calls for.',
  NEW_LOGO: 'A whitespace account (no relationship on record) with ≥$5M of 3-yr loss.',
  NURTURE: 'Real loss, but slow payback (>26 weeks) or confidence is low - worth a conversation, not a sprint.',
  PARK: 'Below the 250 MWdc floor or ownership is unresolved - not callable yet.',
};

// A8: reusable numeric-aware sortable table header, shared with the Evidence
// screen's site table.
function sortIndicator(active, dir) { return active ? (dir === 1 ? ' ▲' : ' ▼') : ''; }
function sortRows(rows, col, numeric, dir) {
  return rows.slice().sort((a, b) => {
    let av = a[col], bv = b[col];
    if (numeric) {
      av = (av === null || av === undefined) ? -Infinity : Number(av);
      bv = (bv === null || bv === undefined) ? -Infinity : Number(bv);
      return dir * (av - bv);
    }
    av = (av ?? '').toString(); bv = (bv ?? '').toString();
    return dir * av.localeCompare(bv);
  });
}

// B6: CSV export on every table, not just the call list.
function exportCsv(cols, rows, filename) {
  const csv = [cols.join(',')].concat(rows.map(row => cols.map(c => JSON.stringify(row[c]===undefined||row[c]===null?'':row[c])).join(',')));
  const blob = new Blob([csv.join('\n')], {type:'text/csv'});
  const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = filename; link.click();
}
function exportBtn(cols, rows, filename) {
  return el('button', {class:'btn secondary no-print', style:'font-size:11px; padding:4px 10px; margin-left:8px',
    onclick:()=>exportCsv(cols, rows, filename)}, ['Export CSV']);
}
function exportAccountsCsv(list) {
  exportCsv(['owner_entity','relationship','focus_band','n_sites','mwdc','coi_3yr_usd','recoverable_usd_yr',
    'fee_annual_usd','payback_weeks','confidence','top_signature','account_owner','ownership_unresolved'],

}

    const avgMwdc = atRisk.length ? atRisk.reduce((a,s)=>a+(s.mwdc||0),0)/atRisk.length : 0;
    const estLoss = rc ? rc.mobilisation_usd + rc.usd_per_mwdc_affected * avgMwdc : null;
    return {sig, nData: withData.length, expected, nAtRisk: atRisk.length, mttr, estLoss};
  }).filter(s => s.nData > 0).sort((a,b) => b.expected - a.expected);

  panelHeader(forecastPanel, 'WHAT BREAKS NEXT', '24-month failure risk and inspection economics, from the reliability model',
    `Based on ${sigStats.length ? sigStats[0].nData : 0} of ${sites.length} sites with a fitted reliability model.`);
  const whatBreaksDetail = el('div', {class:'print-hide'});
  if (sigStats.length) {
    const maxExp = Math.max(...sigStats.map(s=>s.expected), 0.001);
    const barH = 26, gap = 10, leftAxis = 140, chartW = 420;
    const chartH = sigStats.length * (barH+gap);
    const bc = svg('svg', {width:'100%', height: chartH+40, viewBox:`0 0 ${leftAxis+chartW+60} ${chartH+40}`});
    bc.appendChild(svg('line', {x1:leftAxis, y1:0, x2:leftAxis, y2:chartH, stroke:'var(--panel-border)', 'stroke-width':1}));
    sigStats.forEach((s,i) => {
      const y = i*(barH+gap);
      const w = (s.expected/maxExp)*chartW;
      const lbl = svg('text', {x:leftAxis-8, y:y+barH*0.65, 'text-anchor':'end', style:'font:11px Arial; fill:#333'});
      lbl.textContent = SIG_LABEL[s.sig]||s.sig; bc.appendChild(lbl);
      bc.appendChild(svg('rect', {x:leftAxis, y:y+2, width:Math.max(w,1), height:barH-4, fill:'var(--accent)', rx:3}));
      const vt = svg('text', {x:leftAxis+w+6, y:y+barH*0.65, style:'font:11px Arial; fill:#333'});
      vt.textContent = fmt.raw(s.expected,1); bc.appendChild(vt);
    });
    const xTitle = svg('text', {x:leftAxis+chartW/2, y:chartH+30, 'text-anchor':'middle', style:'font:11px Arial; fill:#7a756c'});
    xTitle.textContent = 'Expected failures (count, next 24 months)'; bc.appendChild(xTitle);
    const yTitle = svg('text', {x:8, y:chartH/2, 'text-anchor':'middle', style:'font:11px Arial; fill:#7a756c'});
    yTitle.textContent = 'Fault type'; bc.appendChild(yTitle);
    whatBreaksDetail.appendChild(bc);

    const bt = el('table', {class:'grid'});
    bt.appendChild(el('tr',{},[el('th',{class:'kcol'},['Fault type']),el('th',{},['Sites at risk']),
      el('th',{},['Expected failures (24mo)']),el('th',{},['Mean duration (months)']),
      el('th',{},['Estimated loss if it happens']),el('th',{},['Recommended action'])]));
    sigStats.forEach(s => bt.appendChild(el('tr',{},[
      el('td',{class:'kcol'},[SIG_LABEL[s.sig]||s.sig]), el('td',{},[fmt.count(s.nAtRisk)]),
      el('td',{},[fmt.raw(s.expected,1)]), el('td',{},[s.mttr!=null?fmt.raw(s.mttr,1):'—']),
      el('td',{},[s.estLoss!=null?fmt.usd(s.estLoss):'—']), el('td',{},[SIGNATURE_OFFERING[s.sig]]),
    ])));
    whatBreaksDetail.appendChild(exportBtn(['sig','nAtRisk','expected','mttr','estLoss'], sigStats,
      `ceo_cockpit_${a.owner_entity.replace(/[^a-z0-9]+/gi,'_')}_what_breaks_next.csv`));
    whatBreaksDetail.appendChild(el('div',{class:'tblscroll', style:'margin-top:10px'},[bt]));
    forecastPanel.appendChild(whatBreaksDetail);

    if (insp.length) {
      const modeMonths = insp.sort((x,y)=>insp.filter(v=>v===x).length - insp.filter(v=>v===y).length).pop();
      forecastPanel.appendChild(el('div',{class:'interp', style:'margin-top:10px'},[
        `Recommended inspection cadence across this portfolio clusters around every ${modeMonths} months. `,
        `Total SCADA monitoring value across these sites: ${fmt.usd(sites.reduce((acc,s)=>acc+(s.rel_insp_scada_value_usd||0),0))}/yr.`]));
    }
  } else {
    forecastPanel.appendChild(el('div',{class:'small'},['No reliability forecast available for this account\'s sites.']));
  }
  m.appendChild(forecastPanel);

  const whyPanel = el('div', {class:'card-panel'});
  panelHeader(whyPanel, 'WHY THIS OFFERING', 'Plain English, tied to what is actually happening on site');
  const domSig = a.top_signature;
  const why = {
    SOILING: 'Soiling losses are recoverable with a cleaning programme, and the loss accrues every month it goes unaddressed.',
    BLOCK_OUTAGE: 'Repeat block outages point to a specific, fixable equipment issue, not a systemic design problem.',
    OUTAGE_FULL: 'A full-site outage is the most expensive minute-by-minute loss in the portfolio, and the one continuous monitoring catches fastest.',
    TRACKER: 'Tracker misalignment is a controller/mechanical fix, not a capital replacement.',
    BOS_INTERMITTENT: 'Intermittent balance-of-system faults are hard to see without regular inspection, easy to fix once found.',
    UNATTRIBUTED: 'The cause is not yet confirmed - the first step is a diagnostic, not a guess at the fix.',
  }[domSig] || 'Recommended from this portfolio\'s dominant fault pattern.';
  whyPanel.appendChild(el('div',{class:'interp'},[why]));
  m.appendChild(whyPanel);
}

// =============================================================== SCREEN 4 ==
function renderEvidence(m) {
  const panel = el('div', {class:'card-panel no-print'});
  const relCov = DATA.meta.rel_field_coverage || {};
  const covLine = ['rel_n_blocks', 'rel_insp_optimal_months', 'rel_warranty_remaining_years']
    .filter(f => relCov[f])
    .map(f => `${f} ${fmt.count(relCov[f].n)} of ${fmt.count(relCov[f].of)} sites`)
    .join(' · ');
  panelHeader(panel, 'EVIDENCE', 'Everything the customer\'s engineer will ask about',
    covLine ? `Reliability field coverage across in-scope sites: ${covLine}. Gaps render as "—", not 0.` : undefined);
  const sel = el('select', {class:'sel', style:'min-width:320px', onchange:e=>{state.currentAccount=e.target.value; render();}});
  sel.appendChild(el('option',{value:''},['— pick an account —']));
  DATA.accounts.slice().sort((a,b)=>b.coi_3yr_usd-a.coi_3yr_usd).forEach(a =>
    sel.appendChild(el('option',{value:a.owner_entity, selected:a.owner_entity===state.currentAccount?true:undefined},[a.owner_entity])));
  panel.appendChild(sel);
  m.appendChild(panel);

  // A7: plain-English explanation before the fit table - what a lifetime
  // distribution fit is and how to read beta/eta, in the spec's own words,
  // with this run's actual eta figures substituted into the example.
  const fitPanel = el('div', {class:'card-panel'});
  panelHeader(fitPanel, 'FLEET-WIDE LIFE DATA FIT', 'Pooled Weibull fit per fault signature, not decomposable by account');
  const blockEta = (DATA.reliability.signatures.find(s=>s.signature==='BLOCK_OUTAGE')||{}).weibull_eta_years;
  const trackerEta = (DATA.reliability.signatures.find(s=>s.signature==='TRACKER')||{}).weibull_eta_years;
  fitPanel.appendChild(el('div',{class:'interp'},[
    'We fit a lifetime distribution to each fault type across the whole fleet - the same method wind operators use for gearboxes. It answers how does the chance of this fault change as a plant ages.']));
  fitPanel.appendChild(el('div',{class:'interp'},[
    el('b',{},['β (beta)']), ' is the shape. Below 1 the fault gets less likely with age - an early-life defect, which is a warranty and commissioning conversation. Around 1 it is random. Above 1 it gets more likely with age - wear-out, which is what justifies scheduled replacement. Every fault type here fits above 1.']));
  fitPanel.appendChild(el('div',{class:'interp'},[
    el('b',{},['η (eta)']), ` is the characteristic life, in years - roughly the age by which about 63% of plants have experienced that fault at least once. A larger η means the fault arrives later.${
      blockEta!=null && trackerEta!=null ? ` Block outage at η = ${fmt.eta(blockEta)} years arrives earlier in a plant's life than tracker faults at η = ${fmt.eta(trackerEta)} years.` : ''}`]));
  const ft = el('table', {class:'grid'});
  ft.appendChild(el('tr',{},[el('th',{class:'kcol'},['Signature']),el('th',{},['Best fit']),el('th',{},['Weibull beta']),
    el('th',{},['Classification']),el('th',{},['η (characteristic life, years)']),el('th',{},['RVM eligible'])]));
  DATA.reliability.signatures.forEach(s => ft.appendChild(el('tr',{},[
    el('td',{class:'kcol'},[SIG_LABEL[s.signature]||s.signature]), el('td',{},[s.best_fit_family]),
    el('td',{},[fmt.raw(s.weibull_beta,3)]), el('td',{},[s.beta_classification]), el('td',{},[fmt.eta(s.weibull_eta_years)]),
    el('td',{},[s.rvm_eligible?'Yes':'No']),
  ])));
  fitPanel.appendChild(exportBtn(['signature','best_fit_family','weibull_beta','beta_classification','weibull_eta_years','rvm_eligible'],
    DATA.reliability.signatures, 'ceo_cockpit_fleet_life_data_fit.csv'));
  fitPanel.appendChild(el('div',{class:'tblscroll', style:'margin-top:10px'},[ft]));
  m.appendChild(fitPanel);

  const a = state.currentAccount ? accountByName(state.currentAccount) : null;
  if (!a) { m.appendChild(el('div',{class:'card-panel'},['Pick an account above to see its site-level evidence (PI/PRI, D-band, degradation fit).'])); return; }
  const sites = (DATA.sites_by_account[a.owner_entity] || []).slice();
  // A8: MWdc as the 2nd column, sortable on every column both directions
  // (numeric-aware - reuses the same sortRows/sortIndicator helpers as
  // Priority Accounts' table, but its own sort state so the two screens
  // don't fight over one sort column).
  const EV_COLS = [
    ['site', 'Site', false], ['mwdc', 'MWdc', true], ['latest_pi', 'Latest PI', true],
    ['latest_pri', 'Latest PRI', true], ['beta', 'β', true], ['beta_t', 't-stat', true],
    ['decision_grade', 'Decision-grade', false], ['rel_n_blocks', 'N_blocks', true],
    ['rel_age_years', 'Age (yr)', true],
  ];
  const nSuspectEv = sites.filter(s=>s.capacity_suspect).length;
  const sitesPanel = el('div', {class:'card-panel'});
  panelHeader(sitesPanel, 'SITE-LEVEL EVIDENCE', `${a.owner_entity} - ${sites.length} sites`,
    nSuspectEv ? `${nSuspectEv} site(s) show "capacity under review" - a PI computed from a capacity denominator we don't trust, suppressed rather than shown as a number.` : undefined);
  // evSortCol defaults to 'cost_of_inaction_usd' (worst-first) which isn't
  // one of the displayed/sortable columns, hence the fallback - no header
  // shows as "active" until the user clicks one, same as before.
  const evSortNumeric = (EV_COLS.find(c=>c[0]===state.evSortCol) || [,,true])[2];
  const sitesSorted = sortRows(sites, state.evSortCol, evSortNumeric, state.evSortDir);
  const st = el('table', {class:'grid'});
  const evHead = el('tr', {});
  EV_COLS.forEach(([col,label,numeric]) => {
    const active = state.evSortCol === col;
    evHead.appendChild(el('th', {class:numeric?'':'kcol', style:'cursor:pointer',
      onclick:()=>{ state.evSortDir = (state.evSortCol===col) ? -state.evSortDir : -1; state.evSortCol = col; render(); }},
      [label + sortIndicator(active, state.evSortDir)]));
  });
  st.appendChild(evHead);
  sitesSorted.forEach(s => st.appendChild(el('tr',{},[
    el('td',{class:'kcol'},[s.site, s.capacity_suspect?el('span',{class:'badge suspect', title:'12-month median PI exceeded 1.35 - capacity (MWdc) figure is under review, PI suppressed'},['capacity under review']):null].filter(v=>v!==null)),
    el('td',{},[fmt.mwdc(s.mwdc)]),
    el('td',{},[s.capacity_suspect?'—':fmt.pi(s.latest_pi)]), el('td',{},[fmt.pri(s.latest_pri)]),
    el('td',{},[fmt.beta(s.beta)]), el('td',{},[fmt.raw(s.beta_t,1)]),
    el('td',{},[s.decision_grade?'Yes':'No']), el('td',{},[s.rel_n_blocks!==null&&s.rel_n_blocks!==undefined?fmt.count(s.rel_n_blocks):'—']), el('td',{},[fmt.raw(s.rel_age_years,1)]),
  ])));
  sitesPanel.appendChild(exportBtn(['site','mwdc','latest_pi','latest_pri','beta','beta_t','decision_grade','rel_n_blocks','rel_age_years','capacity_suspect'],
    sitesSorted, `ceo_cockpit_${a.owner_entity.replace(/[^a-z0-9]+/gi,'_')}_site_evidence.csv`));
  sitesPanel.appendChild(el('div',{class:'tblscroll'},[st]));
  m.appendChild(sitesPanel);

  // A8: the Assumptions subsection is gone from this screen - a single
  // collapsed drawer keeps the information reachable without it always
  // occupying space.
  const assumptionsDrawer = el('details', {class:'defs-panel'});
  assumptionsDrawer.appendChild(el('summary', {}, ['Assumptions - what is measured vs. assumed in this build']));
  const adBody = el('div', {class:'defs-body'});
  [
    'Pricing: SaaS $120/MWdc/yr, SCADA $48/MWdc/yr and Inspection $150/MWdc/visit are MEASURED - read from pricing.yaml, the single source of truth this cockpit and explorer.html both derive from (see tests/test_pricing.py).',
    'cost_of_inaction_usd, recoverable_usd_yr, PI/PRI/beta: measured, inherited unchanged from the analyst tool (explorer.html) - ranking signals, not vendor quotes.',
    'Parent/owner rollup: MEASURED for 14 SPVs via parent_mapping.csv (researched from public sources); ASSUMED (rolled up on the raw utility name) for everything else.',
    'GTM relationship match: a conservative, precision-first text matcher - ambiguous/generic tokens are deliberately excluded rather than risk a false customer-relationship claim, so recall is lower than a looser matcher would give. Owners above 250 MWdc that did not match are in ceo_cockpit/data/unmatched_owners.csv for manual review.',
    'Reliability forecast (rel_* fields, Weibull fits, MTTR): fleet-level pooled, no per-site or per-account refit. Repair-cost estimates in pricing.yaml are ESTIMATES pending vendor quotes.',
  ].forEach(t => adBody.appendChild(el('div',{class:'interp'},[t])));
  assumptionsDrawer.appendChild(adBody);
  m.appendChild(assumptionsDrawer);
}

// =============================================================== SCREEN 5 ==
function renderCoverage(m) {
  const cov = DATA.coverage;
  const headline = el('div', {class:'card-panel'});
  panelHeader(headline, 'COVERAGE', 'Assigned vs. unassigned vs. whitespace',
    `${cov.n_reps_named} named reps with in-scope accounts (NAM/mixed only - EU-only reps are out of scope for this US fleet and shown separately, not at zero). ${cov.matched_gtm_accounts} of 109 GTM accounts matched anything in the US solar fleet.`);
  const strip = el('div', {class:'cards'});
  [['Assigned to a named rep', fmt.usd(cov.assigned)], ['Account exists, unassigned', fmt.usd(cov.unassigned)],
   ['Whitespace (no account)', fmt.usd(cov.whitespace)], ['Total in-scope CoI', fmt.usd(cov.total_coi)]]
    .forEach(([l,v]) => strip.appendChild(el('div',{class:'card'},[el('div',{class:'v'},[v]), el('div',{class:'l'},[l])])));
  headline.appendChild(strip);
  m.appendChild(headline);

  // A9: the concentration flag is removed - a rep's solar book looking
  // single-account isn't a real risk when they carry wind accounts too.
  // The account count is split instead: the rep's full book (all
  // technologies, from gtm_accounts.csv) vs. the subset with US solar
  // production data in this fleet - the gap is the honest statement, "we
  // can only see part of what they manage".
  const bookPanel = el('div', {class:'card-panel'});
  panelHeader(bookPanel, 'THE BOOK', 'By account owner, in-scope accounts only');
  const bt = el('table', {class:'grid'});
  bt.appendChild(el('tr',{},[el('th',{class:'kcol'},['Rep']),el('th',{},['Accounts managed (all technologies)']),
    el('th',{},['Accounts with US solar production data']),el('th',{},['Solar MWdc']),
    el('th',{},['Recoverable/yr']),el('th',{},['3-yr CoI'])]));
  cov.book.forEach(b => {
    const tr = el('tr',{});
    [b.rep, b.n_accounts_managed!=null?fmt.count(b.n_accounts_managed):'—', fmt.count(b.n_accounts),
     fmt.mwdc(b.mwdc), fmt.usd(b.recoverable_usd_yr), fmt.usd(b.coi_3yr_usd)]
      .forEach((v,i)=>tr.appendChild(el('td',{class:i===0?'kcol':''},[String(v)])));
    bt.appendChild(tr);
  });
  bookPanel.appendChild(exportBtn(['rep','n_accounts_managed','n_accounts','n_customer','n_prospect','mwdc','recoverable_usd_yr','coi_3yr_usd'],
    cov.book, 'ceo_cockpit_book.csv'));
  bookPanel.appendChild(el('div',{class:'tblscroll'},[bt]));
  m.appendChild(bookPanel);

  // Pass 3 §2: rep revenue subsection. One row per named rep, expandable
  // to the accounts underneath - "still available" (total potential minus
  // already-contracted, from the GTM product flags) is what a CEO reads
  // first, so it's the rightmost, weighted column.
  if (!state.expandedReps) state.expandedReps = {};
  const REV_COLS_HEAD = ['Rep','Accounts managed','Accounts with US solar data','Solar MWdc',
    'Software revenue/yr','Inspection revenue/yr','Total SSI potential/yr','Already contracted','Still available'];
  const revPanel = el('div', {class:'card-panel'});
  const ic = DATA.meta.inspection_coverage;
  panelHeader(revPanel, 'REVENUE', 'Software + inspection potential by rep - click a rep to expand its accounts',
    `Inspection frequency fitted on ${fmt.count(ic.n)} of ${fmt.count(ic.of)} sites; the remainder assume one visit per year. "Lead-offering fee" (Priority Accounts) and "Total SSI potential" (here) answer different questions and are never summed.`);
  const rt = el('table', {class:'grid'});
  rt.appendChild(el('tr',{}, REV_COLS_HEAD.map((h,i)=>el('th',{class:i===0?'kcol':(i===8?'still-avail':'')},[h]))));
  const repsSorted = cov.book.slice().sort((a,b)=>b.still_available_usd_yr-a.still_available_usd_yr);
  repsSorted.forEach(b => {
    const expanded = !!state.expandedReps[b.rep];
    const tr = el('tr', {style:'cursor:pointer', onclick:()=>{state.expandedReps[b.rep]=!expanded; render();}});
    tr.appendChild(el('td',{class:'kcol'},[(expanded?'▾ ':'▸ ')+b.rep]));
    tr.appendChild(el('td',{},[b.n_accounts_managed!=null?fmt.count(b.n_accounts_managed):'—']));
    tr.appendChild(el('td',{},[fmt.count(b.n_accounts)]));
    tr.appendChild(el('td',{},[fmt.mwdc(b.mwdc)]));
    tr.appendChild(el('td',{},[fmt.usd(b.software_revenue_usd_yr)]));
    tr.appendChild(el('td',{},[fmt.usd(b.inspection_revenue_usd_yr)]));
    tr.appendChild(el('td',{},[fmt.usd(b.total_ssi_potential_usd_yr)]));
    tr.appendChild(el('td',{},[fmt.usd(b.already_contracted_usd_yr)]));
    tr.appendChild(el('td',{class:'still-avail'},[fmt.usd(b.still_available_usd_yr)]));
    rt.appendChild(tr);
    if (expanded) {
      (cov.accounts_by_book[b.rep]||[]).forEach(a => {
        const atr = el('tr', {class:'rep-account-row', style:'cursor:pointer',
          onclick:(e)=>{e.stopPropagation(); if(accountByName(a.owner_entity)){state.currentAccount=a.owner_entity; state.view='pitch'; render();}}});
        atr.appendChild(el('td',{class:'kcol', style:'padding-left:24px'},[a.owner_entity]));
        atr.appendChild(el('td',{},['—']));
        atr.appendChild(el('td',{},['—']));
        atr.appendChild(el('td',{},[fmt.mwdc(a.mwdc)]));
        atr.appendChild(el('td',{},[fmt.usd(a.software_revenue_usd_yr)]));
        atr.appendChild(el('td',{},[fmt.usd(a.inspection_revenue_usd_yr)]));
        atr.appendChild(el('td',{},[fmt.usd(a.total_ssi_potential_usd_yr)]));
        atr.appendChild(el('td',{},[fmt.usd(a.already_contracted_usd_yr)]));
        atr.appendChild(el('td',{class:'still-avail'},[fmt.usd(a.still_available_usd_yr)]));
        rt.appendChild(atr);
      });
    }
  });
  revPanel.appendChild(exportBtn(['rep','n_accounts_managed','n_accounts','mwdc','software_revenue_usd_yr',
    'inspection_revenue_usd_yr','total_ssi_potential_usd_yr','already_contracted_usd_yr','still_available_usd_yr'],
    cov.book, 'ceo_cockpit_rep_revenue.csv'));
  revPanel.appendChild(el('div',{class:'tblscroll'},[rt]));
  m.appendChild(revPanel);

  const focusPanel = el('div', {class:'card-panel'});
  panelHeader(focusPanel, 'FOCUS BANDS', 'Every in-scope account, one band, one reason');
  const bandCounts = {};
  DATA.accounts.forEach(a => bandCounts[a.focus_band] = (bandCounts[a.focus_band]||0)+1);
  const bandStrip = el('div', {class:'cards'});
  ['FOCUS_NOW','EXPAND','NEW_LOGO','NURTURE','PARK'].forEach(band => bandStrip.appendChild(
    el('div',{class:'card'},[el('div',{class:'v'},[fmt.count(bandCounts[band]||0)]), el('div',{class:'l'},[band.replace('_',' ')])])));
  focusPanel.appendChild(bandStrip);
  m.appendChild(focusPanel);
}

// B6 / Pass 3 §1.1: deep links - #account=<owner> opens straight to that
// account's pitch page; #geo=map|table opens Addressable Market on that
// presentation (so a link opens on the view the sender was looking at).
(function applyInitialHash() {
  const acctMatch = /^#account=(.+)$/.exec(location.hash);
  const geoMatch = /^#geo=(map|table)$/.exec(location.hash);
  if (acctMatch) { state.currentAccount = decodeURIComponent(acctMatch[1]); state.view = 'pitch'; }
  else if (geoMatch) { state.view = 'market'; state.geoView = geoMatch[1]; }
})();
render();
</script>
</body>
</html>
